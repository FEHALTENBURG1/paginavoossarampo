name: Atualizar dashboard

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília, todo dia
  workflow_dispatch:
  push:
    branches: [main]
    paths: [atualizar.py, template.html, requirements.txt, .github/workflows/atualizar.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar da ANAC e gerar o HTML
        run: python atualizar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
